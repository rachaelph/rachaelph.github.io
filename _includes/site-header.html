<header class="header">
  <div class="container">
    <!-- Custom centered header with logo and tagline -->
    <div class="header-custom" style="text-align: center; margin: 20px 0;">
      {% if site.logo %}
        <a class="logo-custom" href="{{ site.baseurl }}/" style="display: inline-block; text-decoration: none;">
          <img src="{{ site.baseurl }}{{ site.logo }}" alt="{{ site.title | append: ' logo' }}" style="width: 120px; height: 120px; margin-bottom: 10px;"/>
          <h1 style="font-family: 'Georgia', 'Times New Roman', serif; font-size: 2.2em; margin: 10px 0 5px 0; color: #333;">{{ site.title }}</h1>
          <p style="font-family: 'Raleway', 'Helvetica Neue', sans-serif; font-size: 1.1em; color: #1a8b9d; margin: 0; font-weight: 300; letter-spacing: 1px;">Life, Love, and Adventures</p>
        </a>
      {% endif %}
    </div>

    {% include nav-header.html %}
  </div>

  {% include site-feature.html %}

</header>
