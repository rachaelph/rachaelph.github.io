<header class="header">
  <div class="container">
    <!-- Custom header with logo and tagline -->
    <div class="header-custom" style="display: flex; align-items: center; justify-content: center; margin: 15px 0;">
      {% if site.logo %}
        <a class="logo-custom" href="{{ site.baseurl }}/" style="display: flex; align-items: center; text-decoration: none; gap: 15px;">
          <img src="{{ site.baseurl }}{{ site.logo }}" alt="{{ site.title | append: ' logo' }}" style="width: 50px; height: 50px; flex-shrink: 0;"/>
          <p style="font-family: 'Raleway', 'Helvetica Neue', sans-serif; font-size: 1.1em; color: #1a8b9d; margin: 0; font-weight: 300; letter-spacing: 1px;">Life, Love, and Adventures</p>
        </a>
      {% endif %}
    </div>

    {% include nav-header.html %}
  </div>

  {% include site-feature.html %}

</header>
