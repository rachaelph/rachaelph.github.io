<header class="header">
  <div class="container">
    <!-- Custom header with logo and tagline -->
    <div class="header-custom" style="display: flex; align-items: center; justify-content: center; margin: 15px 0;">
      {% if site.logo %}
        <a class="logo-custom" href="{{ site.baseurl }}/" style="display: flex; align-items: center; text-decoration: none; gap: 15px;">
          <img src="{{ site.baseurl }}{{ site.logo }}" alt="{{ site.title | append: ' logo' }}" style="width: 50px; height: 50px; flex-shrink: 0;"/>
          <div style="text-align: left;">
            <h1 style="font-family: 'Raleway', 'Helvetica Neue', sans-serif; font-size: 0.95em; margin: 0; color: #1a8b9d; line-height: 1.2; font-weight: 400;">{{ site.title }}</h1>
            <p style="font-family: 'Raleway', 'Helvetica Neue', sans-serif; font-size: 0.65em; color: #1a8b9d; margin: 2px 0 0 0; font-weight: 300; letter-spacing: 1px;">Life, Love, and Adventures</p>
          </div>
        </a>
      {% endif %}
    </div>

    {% include nav-header.html %}
  </div>

  {% include site-feature.html %}

</header>
